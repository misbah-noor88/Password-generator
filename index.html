 
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <p class="tag">QUICK & SECURE</p>

        <h1>Password <span>Generator</span></h1>
        <p class="subtitle">Create a strong password in one click.</p>

        <label class="label">YOUR NEW PASSWORD</label>

        <div class="password-box">
            <input
                type="text"
                id="password"
                placeholder="Your password appears here"
                readonly
            >

            <button id="copyBtn" title="Copy password" aria-label="Copy password">
                <svg viewBox="0 0 24 24" width="23" height="23" fill="none"
                     stroke="currentColor" stroke-width="2">
                    <rect x="8" y="8" width="12" height="12" rx="2"></rect>
                    <path d="M16 8V5a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h3"></path>
                </svg>
            </button>
        </div>

        <div class="settings">


            <div class="options">
                <label><input type="checkbox" id="uppercase" checked> Uppercase</label>
                <label><input type="checkbox" id="numbers" checked> Numbers</label>
                <label><input type="checkbox" id="symbols" checked> Symbols</label>
            </div>
        </div>

        <button id="generateBtn" class="generate-btn">
            Generate Password ↻
        </button>

        <p class="hint" id="hint">Use a unique password for every account.</p>
    </div>

    <div class="toast" id="toast" role="status">
        <span class="check">✓</span>
        <div>
            <strong>Copy Done!</strong>
            <small>Password copied to clipboard</small>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
